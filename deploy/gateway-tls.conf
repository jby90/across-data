# Docker service addresses can change on replacement; nginx >= 1.27.3 resolves them.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 3s;
upstream cy_api { zone cy_api 64k; server api:8000 resolve; }
upstream cy_user { zone cy_user 64k; server web-user:80 resolve; }
upstream cy_admin { zone cy_admin 64k; server web-admin:80 resolve; }
server {
  listen 443 ssl;
  http2 on;
  ssl_certificate /etc/letsencrypt/live/cyshuhe-ip/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/cyshuhe-ip/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_tokens off;
  client_max_body_size 100m;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location /api/ {
    proxy_pass http://cy_api;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    add_header Cache-Control "no-store";
  }
  location = /admin { return 308 /admin/; }
  location /admin/ { proxy_pass http://cy_admin/; }
  location / { proxy_pass http://cy_user; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
}

server {
  listen 80;
  server_tokens off;
  location /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 308 https://$host$request_uri; }
}
