name: cyshuhe
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
x-runtime: &runtime
  CYSH_ENV: prod
  CYSH_DATABASE_URL: postgresql+asyncpg://cyshuhe_runtime:${CYSH_RUNTIME_DB_PASSWORD:?required}@db:5432/cyshuhe
  CYSH_JWT_SECRET: ${CYSH_JWT_SECRET:?required}
  CYSH_CORS_ORIGINS: ${CYSH_CORS_ORIGINS:-["http://localhost"]}
  CYSH_ARCHIVE_DIR: /data/archive
  CYSH_LLM_API_KEY: ${CYSH_LLM_API_KEY:-}
  CYSH_LLM_BASE_URL: ${CYSH_LLM_BASE_URL:-https://api.deepseek.com/v1}
  CYSH_LLM_MODEL: ${CYSH_LLM_MODEL:-deepseek-flash}
  CYSH_LLM_REDACTION: "on"
  CYSH_CITATION_POLICY: allow_machine_with_notice
services:
  db:
    logging: *logging
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    mem_limit: 320m
    environment:
      POSTGRES_DB: cyshuhe
      POSTGRES_USER: cyshuhe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "work_mem=2MB", "-c", "max_connections=60"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyshuhe -d cyshuhe"]
      interval: 5s
      timeout: 3s
      retries: 20
  migrate:
    logging: *logging
    image: cyshuhe-api:${CYSH_RELEASE:-local}
    build: {context: ../backend}
    restart: "no"
    mem_limit: 256m
    command: ["sh", "-c", "alembic upgrade head && python -m app.runtime_role"]
    depends_on: {db: {condition: service_healthy}}
    environment:
      CYSH_DATABASE_URL: postgresql+asyncpg://cyshuhe:${POSTGRES_PASSWORD}@db:5432/cyshuhe
      CYSH_JWT_SECRET: ${CYSH_JWT_SECRET:?required}
      CYSH_RUNTIME_DB_PASSWORD: ${CYSH_RUNTIME_DB_PASSWORD:?required}
  api:
    logging: *logging
    image: cyshuhe-api:${CYSH_RELEASE:-local}
    build: {context: ../backend}
    restart: unless-stopped
    mem_limit: 420m
    depends_on: {migrate: {condition: service_completed_successfully}}
    environment: *runtime
    volumes: [archive:/data/archive]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10
  worker:
    logging: *logging
    image: cyshuhe-api:${CYSH_RELEASE:-local}
    build: {context: ../backend}
    restart: unless-stopped
    mem_limit: 320m
    command: ["python", "-m", "app.worker"]
    depends_on: {api: {condition: service_healthy}}
    environment:
      <<: *runtime
      CYSH_CRAWL_ALLOW_RESOLVED_CIDRS: "[]"
    volumes: [archive:/data/archive]
  web-user:
    logging: *logging
    image: cyshuhe-web-user:${CYSH_RELEASE:-local}
    build: {context: .., dockerfile: apps/web-user/Dockerfile}
    restart: unless-stopped
    mem_limit: 48m
  web-admin:
    logging: *logging
    image: cyshuhe-web-admin:${CYSH_RELEASE:-local}
    build: {context: .., dockerfile: apps/web-admin/Dockerfile}
    restart: unless-stopped
    mem_limit: 48m
  nginx:
    logging: *logging
    image: nginx:1.28-alpine
    restart: unless-stopped
    mem_limit: 48m
    depends_on: [web-user, web-admin, api]
    ports: ["${CYSH_BIND_IP:-127.0.0.1}:${CYSH_HTTP_PORT:-18080}:80"]
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - acme:/var/www/acme:ro
volumes:
  pgdata:
  archive:
  acme:
