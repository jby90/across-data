services:
  db:
    image: pgvector/pgvector:pg16 # PostgreSQL License;内含 pgvector(后续检索使用)
    restart: unless-stopped
    environment:
      POSTGRES_DB: cyshuhe
      POSTGRES_USER: cyshuhe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请通过环境变量设置 POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyshuhe -d cyshuhe"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432" # 仅本机可访问

  migrate:
    build:
      context: ../backend
    restart: "no"
    command: ["sh", "-c", "uv run --no-dev alembic upgrade head && uv run --no-dev python -m app.runtime_role"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      CYSH_DATABASE_URL: postgresql+asyncpg://cyshuhe:${POSTGRES_PASSWORD}@db:5432/cyshuhe
      CYSH_JWT_SECRET: ${CYSH_JWT_SECRET:?请设置 CYSH_JWT_SECRET}
      CYSH_RUNTIME_DB_PASSWORD: ${CYSH_RUNTIME_DB_PASSWORD:?请通过环境变量设置普通应用数据库密码}

  api:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      CYSH_ENV: ${CYSH_ENV:-prod}
      CYSH_DATABASE_URL: postgresql+asyncpg://cyshuhe_runtime:${CYSH_RUNTIME_DB_PASSWORD}@db:5432/cyshuhe
      CYSH_JWT_SECRET: ${CYSH_JWT_SECRET:?请通过环境变量设置 CYSH_JWT_SECRET}
      CYSH_CORS_ORIGINS: ${CYSH_CORS_ORIGINS:-["http://localhost:5173","http://localhost:5174"]}
    ports:
      - "127.0.0.1:8000:8000"

  # 后台 worker:定时轮询到期站点并采集(与 api 同一镜像)
  worker:
    build:
      context: ../backend
    restart: unless-stopped
    command: ["uv", "run", "--no-dev", "python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_started
    environment:
      CYSH_ENV: ${CYSH_ENV:-prod}
      CYSH_DATABASE_URL: postgresql+asyncpg://cyshuhe_runtime:${CYSH_RUNTIME_DB_PASSWORD}@db:5432/cyshuhe
      CYSH_JWT_SECRET: ${CYSH_JWT_SECRET:?请通过环境变量设置 CYSH_JWT_SECRET}
      CYSH_CRAWL_ALLOW_RESOLVED_CIDRS: ${CYSH_CRAWL_ALLOW_RESOLVED_CIDRS:-[]}
    volumes:
      - archive:/data/archive

volumes:
  pgdata:
  archive:
